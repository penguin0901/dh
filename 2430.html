<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>输入姓名查看图片</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, sans-serif;
        }
        body {
            background-color: #f3f4f6;
            padding: 40px 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .container {
            background: #ffffff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 2px 12px #00000015;
        }
        h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #222;
        }
        .input-wrap {
            display: flex;
            gap:10px;
            margin-bottom:24px;
        }
        #nameInput {
            flex:1;
            padding:12px 16px;
            font-size:16px;
            border:1px solid #ccc;
            border-radius:8px;
        }
        #showBtn {
            padding:12px 22px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
        }
        #showBtn:hover {
            background:#1d4ed8;
        }
        .img-box {
            width:100%;
            min-height:200px;
            border:1px dashed #cccccc;
            border-radius:8px;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:16px;
        }
        #resultImg {
            max-width:100%;
            max-height:550px;
            display:none;
        }
        .tip {
            color:#888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>输入姓名查看图片</h2>
        <div class="input-wrap">
            <input type="text" id="nameInput" placeholder="请输入姓名">
            <button id="showBtn">查看图片</button>
        </div>
        <div class="img-box">
            <span class="tip" id="tipText">图片将在这里显示</span>
            <img id="resultImg" alt="加载的图片">
        </div>
    </div>

    <script>
        const nameInput = document.getElementById('nameInput');
        const showBtn = document.getElementById('showBtn');
        const resultImg = document.getElementById('resultImg');
        const tipText = document.getElementById('tipText');

        function loadImage(){
            const name = nameInput.value.trim();
            if(!name){
                tipText.innerText="请输入姓名";
                resultImg.style.display='none';
                return;
            }
            //拼接图片地址 http://97hs.cn/2025/输入的姓名.jpg
            const imgUrl = `http://97hs.cn/2025/${name}.jpg`;
            resultImg.src = imgUrl;

            tipText.innerText="加载中...";
            resultImg.style.display="none";

            resultImg.onload = function(){
                tipText.innerText="";
                resultImg.style.display="block";
            }
            resultImg.onerror = function(){
                tipText.innerText="图片不存在或加载失败";
                resultImg.style.display="none";
            }
        }

        showBtn.addEventListener('click', loadImage);
        //回车触发
        nameInput.addEventListener('keydown',e=>{
            if(e.key === 'Enter') loadImage();
        })
    </script>
</body>
</html>
