<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>打贪官</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
            color: #fff;
        }
        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ff6b6b;
            text-align:center;
        }
        .info {
            font-size: 22px;
            margin-bottom: 20px;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(3, 120px);
            gap:16px;
        }
        .hole {
            width:120px;
            height:120px;
            background:#7f8c8d;
            border-radius:12px;
            position:relative;
            overflow:hidden;
        }
        .rat {
            width: 100px;
            height:100px;
            background-color:#c0392b;
            border-radius:8px;
            position:absolute;
            bottom:-100px;
            left:10px;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:48px;
            color:white;
            font-weight:bold;
            transition: bottom 0.12s ease;
            cursor:pointer;
        }
        .rat.show {
            bottom:10px;
        }
        /* 弹窗遮罩 */
        .mask {
            position: fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.85);
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            z-index:99;
        }
        .mask.hidden {
            display:none;
        }
        .mask h2{
            font-size:42px;
            margin-bottom:24px;
        }
        .mask p{
            font-size:20px;
            margin-bottom:30px;
        }
        .mask button{
            padding:10px 30px;
            font-size:20px;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <!-- 开始弹窗 -->
    <div class="mask" id="startMask">
        <h2>打贪官</h2>
        <p>点击弹出带有“tan”字方块，30秒内获取更高分数</p>
        <button id="enterGameBtn">进入游戏</button>
    </div>

    <!-- 结束弹窗 -->
    <div class="mask hidden" id="endMask">
        <h2>游戏结束</h2>
        <p>你的得分：<span id="finalScore">0</span></p>
        <button id="restartBtn">再来一局</button>
    </div>

    <h1>打贪官</h1>
    <div class="info">分数：<span id="score">0</span>｜剩余时间：<span id="time">30</span>秒</div>
    <div class="container" id="gameBox">
        <div class="hole"><div class="rat">tan</div></div>
        <div class="hole"><div class="rat">tan</div></div>
        <div class="hole"><div class="rat">tan</div></div>
        <div class="hole"><div class="rat">tan</div></div>
        <div class="hole"><div class="rat">tan</div></div>
        <div class="hole"><div class="rat">tan</div></div>
        <div class="hole"><div class="rat">tan</div></div>
        <div class="hole"><div class="rat">tan</div></div>
        <div class="hole"><div class="rat">tan</div></div>
    </div>

<script>
const scoreDom = document.getElementById('score');
const timeDom = document.getElementById('time');
const rats = document.querySelectorAll('.rat');
const startMask = document.getElementById('startMask');
const endMask = document.getElementById('endMask');
const enterGameBtn = document.getElementById('enterGameBtn');
const restartBtn = document.getElementById('restartBtn');
const finalScoreDom = document.getElementById('finalScore');

let score = 0;
let timeLeft = 30;
let timerGame = null;
let showTimer = null;
let isPlaying = false;

// 封装点击处理函数
function hitRat(e, rat) {
    e.preventDefault();
    e.stopPropagation();
    if(!rat.classList.contains('show') || !isPlaying) return;
    score +=10;
    scoreDom.innerText = score;
    rat.classList.remove('show');
}

rats.forEach(rat=>{
    rat.addEventListener('click', (e)=> hitRat(e, rat));
    rat.addEventListener('touchend', (e)=> hitRat(e, rat));
})

function randomShow(){
    rats.forEach(r=>r.classList.remove('show'));
    const idx = Math.floor(Math.random()*rats.length);
    rats[idx].classList.add('show');
    setTimeout(()=>{
        rats[idx].classList.remove('show');
    },600)
}

function startGame(){
    score = 0;
    timeLeft = 30;
    scoreDom.innerText=score;
    timeDom.innerText=timeLeft;
    isPlaying=true;
    startMask.classList.add('hidden');
    endMask.classList.add('hidden');

    timerGame = setInterval(()=>{
        timeLeft--;
        timeDom.innerText=timeLeft;
        if(timeLeft<=0){
            endGame();
        }
    },1000)

    showTimer = setInterval(randomShow,700);
}

function endGame(){
    isPlaying=false;
    clearInterval(timerGame);
    clearInterval(showTimer);
    rats.forEach(r=>r.classList.remove('show'));
    finalScoreDom.innerText = score;
    endMask.classList.remove('hidden');
}

enterGameBtn.addEventListener('click',startGame);
restartBtn.addEventListener('click',startGame);
enterGameBtn.addEventListener('touchend',startGame);
restartBtn.addEventListener('touchend',startGame);
</script>
</body>
</html>
