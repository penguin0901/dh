<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公开留言板</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui, sans-serif;
}
body{
  max-width:700px;
  margin:30px auto;
  padding:0 20px;
  background:#f7f8fa;
}
h1{
  text-align:center;
  margin-bottom:30px;
  color:#222;
}
.form-box{
  background:#fff;
  padding:24px;
  border-radius:12px;
  box-shadow:0 2px 10px #00000012;
  margin-bottom:30px;
}
input[name="username"]{
  width:100%;
  padding:12px;
  font-size:16px;
  border:1px solid #ddd;
  border-radius:8px;
  margin-bottom:16px;
}
textarea{
  width:100%;
  height:140px;
  padding:12px;
  font-size:16px;
  border:1px solid #ddd;
  border-radius:8px;
  resize:vertical;
  margin-bottom:16px;
}
button{
  width:100%;
  padding:14px;
  background:#2563eb;
  color:white;
  border:none;
  border-radius:8px;
  font-size:17px;
  cursor:pointer;
}
button:hover{
  background:#1d4ed8;
}
.msg-item{
  background:#fff;
  padding:18px;
  border-radius:10px;
  margin-bottom:14px;
  box-shadow:0 1px 6px #0000000f;
}
.msg-name{
  font-weight:bold;
  color:#2563eb;
  margin-bottom:6px;
}
.msg-time{
  font-size:12px;
  color:#888;
  margin-bottom:8px;
}
.msg-content{
  color:#333;
  line-height:1.6;
}
</style>
</head>
<body>
<h1>📝 公开留言板</h1>
<div class="form-box">
  <input type="text" id="username" placeholder="输入你的名字" required>
  <textarea id="msgContent" placeholder="写下你的留言..." required></textarea>
  <button id="submitBtn">提交留言</button>
</div>

<div id="messageList"></div>

<script>
// =========在这里替换成你自己Supabase项目信息============
const SUPABASE_URL = "https://dpbvnwvrcddsjmycxdno.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_m_XKgn60bBLqKf9e8VYwDw_zBttDgFh";
// =======================================================

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// 加载全部留言
async function loadMessages(){
  const {data, error} = await supabase
    .from('messages')
    .select('*')
    .order('created_at', {ascending:false});
  if(error) return console.error(error);
  const container = document.getElementById("messageList");
  container.innerHTML = "";
  data.forEach(item=>{
    const div = document.createElement("div");
    div.className = "msg-item";
    const time = new Date(item.created_at).toLocaleString();
    div.innerHTML = `
      <div class="msg-name">${escapeHtml(item.name)}</div>
      <div class="msg-time">${time}</div>
      <div class="msg-content">${escapeHtml(item.content)}</div>
    `;
    container.appendChild(div);
  })
}

// 提交留言
document.getElementById("submitBtn").onclick = async ()=>{
  const name = document.getElementById("username").value.trim();
  const content = document.getElementById("msgContent").value.trim();
  if(!name || !content){
    alert("名字和留言不能为空");
    return;
  }
  const {error} = await supabase.from('messages').insert([{name,content}]);
  if(error){
    alert("提交失败："+error.message);
  }else{
    document.getElementById("username").value = "";
    document.getElementById("msgContent").value = "";
    loadMessages(); //提交成功刷新留言列表
  }
}

// 简单防XSS，转义html
function escapeHtml(str) {
  return str.replace(/[&<>"']/g, function(m) {
    const map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'};
    return map[m];
  });
}

// 页面打开自动加载留言
loadMessages();
</script>
</body>
</html>
