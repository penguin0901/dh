<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>铁履与红雪 - 1989 罗马尼亚十二月革命</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg:         'hsl(90 10% 10%)',
          surface:    'hsl(90 8% 15%)',
          'surface-2':'hsl(90 7% 20%)',
          text:       'hsl(90 10% 92%)',
          'text-muted':'hsl(90 8% 60%)',
          primary:    'hsl(90 25% 35%)',
          'primary-l':'hsl(90 30% 50%)',
          accent:     'hsl(0 70% 50%)',
          'accent-l': 'hsl(0 75% 62%)',
          border:     'hsl(90 8% 25%)',
          weapon:     'hsl(25 60% 45%)',
          human:      'hsl(340 60% 55%)',
        },
        fontFamily: {
          serif: ['"Noto Serif SC"', '"Source Han Serif SC"', '"Songti SC"', 'SimSun', 'serif'],
          sans: ['-apple-system', '"PingFang SC"', '"Microsoft YaHei"', 'sans-serif'],
        },
      }
    }
  };
</script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  img, video { max-width: 100%; height: auto; display: block; }
  body { overflow-wrap: break-word; margin: 0; background: #000; color: hsl(90 10% 92%); font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }

  /* ===== 游戏容器 ===== */
  #game {
    position: fixed; inset: 0;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ===== 背景层 ===== */
  .bg-layer {
    position: absolute; inset: 0;
    background-size: cover;
    background-position: center;
    transition: opacity 1.2s ease, transform 8s ease-out;
    filter: brightness(0.85) saturate(0.9);
  }
  .bg-layer::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.55) 100%);
    pointer-events: none;
  }
  .bg-kenburns {
    animation: kenburns 20s ease-in-out infinite alternate;
  }
  @keyframes kenburns {
    0%   { transform: scale(1.0) translate(0, 0); }
    100% { transform: scale(1.08) translate(-1%, -1%); }
  }

  /* ===== 立绘层 ===== */
  .sprite-layer {
    position: absolute; inset: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    pointer-events: none;
  }
  .sprite {
    position: absolute;
    bottom: 0;
    height: 85%;
    max-height: 85vh;
    transition: opacity 0.6s ease, transform 0.6s ease;
    filter: drop-shadow(0 10px 30px rgba(0,0,0,0.6));
  }
  .sprite.left  { left: 5%;  transform: translateX(-20px); }
  .sprite.right { right: 5%; transform: translateX(20px); }
  .sprite.center { left: 50%; transform: translateX(-50%); }
  .sprite.show.left  { transform: translateX(0); }
  .sprite.show.right { transform: translateX(0); }
  .sprite.show.center { transform: translateX(-50%); }

  /* ===== 对话框 ===== */
  .dialog-box {
    position: absolute;
    left: 50%; bottom: 24px;
    transform: translateX(-50%);
    width: min(92%, 960px);
    background: linear-gradient(180deg, rgba(20,24,18,0.88) 0%, rgba(12,15,11,0.95) 100%);
    border: 1px solid hsl(90 15% 28%);
    border-radius: 6px;
    padding: 20px 28px 22px;
    backdrop-filter: blur(6px);
    box-shadow: 0 8px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .dialog-box::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, hsl(90 25% 45%), transparent);
  }
  .speaker-name {
    display: inline-block;
    padding: 4px 14px;
    font-family: "Noto Serif SC", serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 2px;
    color: hsl(90 30% 75%);
    background: linear-gradient(180deg, hsl(90 20% 22%), hsl(90 18% 16%));
    border: 1px solid hsl(90 15% 30%);
    border-radius: 3px;
    margin-bottom: 10px;
  }
  .speaker-name.tanke { color: hsl(25 70% 70%); border-color: hsl(25 40% 35%); background: linear-gradient(180deg, hsl(25 30% 20%), hsl(25 20% 14%)); }
  .speaker-name.mihai { color: hsl(200 50% 75%); border-color: hsl(200 30% 35%); background: linear-gradient(180deg, hsl(200 25% 20%), hsl(200 18% 14%)); }
  .speaker-name.anna { color: hsl(340 60% 78%); border-color: hsl(340 35% 38%); background: linear-gradient(180deg, hsl(340 25% 20%), hsl(340 18% 14%)); }
  .speaker-name.narr { color: hsl(90 10% 65%); }

  .dialog-text {
    font-size: 17px;
    line-height: 1.9;
    color: hsl(90 10% 92%);
    min-height: 96px;
    letter-spacing: 0.5px;
  }
  .dialog-text .cursor {
    display: inline-block;
    width: 2px; height: 1em;
    background: hsl(90 30% 70%);
    vertical-align: text-bottom;
    margin-left: 2px;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .click-indicator {
    position: absolute;
    right: 20px; bottom: 12px;
    width: 10px; height: 10px;
    border-right: 2px solid hsl(90 30% 70%);
    border-bottom: 2px solid hsl(90 30% 70%);
    transform: rotate(45deg);
    animation: bounce 1.2s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: rotate(45deg) translate(0, 0); opacity: 1; }
    50%      { transform: rotate(45deg) translate(4px, 4px); opacity: 0.5; }
  }

  /* ===== 选项 ===== */
  .choices-box {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: min(90%, 680px);
    z-index: 30;
  }
  .choice-btn {
    padding: 16px 24px;
    font-size: 16px;
    color: hsl(90 10% 92%);
    background: linear-gradient(180deg, rgba(30,36,26,0.92), rgba(18,22,16,0.95));
    border: 1px solid hsl(90 15% 32%);
    border-radius: 4px;
    cursor: pointer;
    text-align: left;
    transition: all 0.25s ease;
    letter-spacing: 1px;
    position: relative;
    overflow: hidden;
  }
  .choice-btn::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px;
    background: hsl(90 30% 50%);
    transform: scaleY(0);
    transition: transform 0.25s ease;
  }
  .choice-btn:hover {
    border-color: hsl(90 30% 55%);
    background: linear-gradient(180deg, rgba(40,50,34,0.95), rgba(24,30,20,0.98));
    transform: translateX(4px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .choice-btn:hover::before { transform: scaleY(1); }

  /* ===== 顶部 HUD ===== */
  .top-hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(180deg, rgba(0,0,0,0.7), transparent);
    z-index: 20;
    pointer-events: none;
  }
  .top-hud > * { pointer-events: auto; }
  .chapter-label {
    font-family: "Noto Serif SC", serif;
    font-size: 14px;
    letter-spacing: 3px;
    color: hsl(90 15% 75%);
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  }
  .chapter-label .day {
    color: hsl(25 70% 65%);
    font-weight: 700;
  }
  .stat-bar-wrap {
    display: flex;
    gap: 16px;
    align-items: center;
  }
  .stat-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    letter-spacing: 1px;
  }
  .stat-bar {
    width: 80px; height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    overflow: hidden;
  }
  .stat-bar-fill {
    height: 100%;
    transition: width 0.6s ease;
    border-radius: 3px;
  }
  .stat-bar-fill.weapon { background: linear-gradient(90deg, hsl(25 60% 40%), hsl(25 70% 60%)); }
  .stat-bar-fill.human  { background: linear-gradient(90deg, hsl(340 50% 45%), hsl(340 70% 65%)); }

  .menu-btn {
    width: 36px; height: 36px;
    display: grid; place-items: center;
    background: rgba(20,24,18,0.7);
    border: 1px solid hsl(90 10% 28%);
    border-radius: 4px;
    cursor: pointer;
    color: hsl(90 15% 75%);
    transition: all 0.2s;
  }
  .menu-btn:hover { background: rgba(40,50,34,0.9); color: hsl(90 30% 85%); }

  /* ===== 标题界面 ===== */
  .title-screen {
    position: absolute; inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, hsl(90 10% 14%) 0%, hsl(0 0% 3%) 100%);
    z-index: 50;
    transition: opacity 1s ease;
  }
  .title-screen::before {
    content: '';
    position: absolute; inset: 0;
    background-image: url("https://aka.doubaocdn.com/s/xcdxLAorg7");
    background-size: cover;
    background-position: center 30%;
    opacity: 0.15;
    filter: grayscale(0.5) contrast(1.2);
    animation: titleFloat 15s ease-in-out infinite alternate;
  }
  @keyframes titleFloat {
    0%   { transform: scale(1); }
    100% { transform: scale(1.05); }
  }
  .title-screen::after {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 50% 30%, transparent 0%, rgba(0,0,0,0.7) 100%),
      linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.85) 100%);
  }
  .title-content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 0 24px;
  }
  .game-title {
    font-family: "Noto Serif SC", serif;
    font-weight: 900;
    font-size: clamp(2.5rem, 8vw, 5.5rem);
    letter-spacing: 12px;
    color: hsl(90 10% 92%);
    text-shadow: 0 0 40px rgba(180,140,80,0.3), 0 4px 20px rgba(0,0,0,0.8);
    margin-bottom: 8px;
    animation: titleFade 2s ease-out;
  }
  .game-title .red { color: hsl(0 65% 55%); }
  @keyframes titleFade {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .game-subtitle {
    font-family: "Noto Serif SC", serif;
    font-size: clamp(0.9rem, 2vw, 1.2rem);
    letter-spacing: 6px;
    color: hsl(90 10% 60%);
    margin-bottom: 48px;
    animation: titleFade 2s ease-out 0.3s both;
  }
  .title-menu {
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: center;
    animation: titleFade 2s ease-out 0.6s both;
  }
  .title-btn {
    width: 220px;
    padding: 12px 32px;
    font-family: "Noto Serif SC", serif;
    font-size: 16px;
    letter-spacing: 4px;
    color: hsl(90 10% 85%);
    background: transparent;
    border: 1px solid hsl(90 15% 35%);
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
  }
  .title-btn:hover {
    background: hsl(90 20% 22%);
    border-color: hsl(90 30% 55%);
    color: hsl(90 20% 95%);
    letter-spacing: 6px;
  }
  .title-btn.primary {
    background: linear-gradient(180deg, hsl(90 25% 28%), hsl(90 20% 18%));
    border-color: hsl(90 30% 45%);
  }
  .title-btn.primary:hover {
    background: linear-gradient(180deg, hsl(90 30% 38%), hsl(90 25% 25%));
  }

  /* ===== 系统面板（存档/设置等） ===== */
  .system-panel {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .system-panel.show { opacity: 1; pointer-events: auto; }
  .panel-content {
    width: min(92%, 720px);
    max-height: 85vh;
    background: linear-gradient(180deg, hsl(90 8% 16%), hsl(90 7% 12%));
    border: 1px solid hsl(90 10% 25%);
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .panel-header {
    display: flex;
    border-bottom: 1px solid hsl(90 10% 22%);
    background: hsl(90 7% 14%);
  }
  .panel-tab {
    flex: 1;
    padding: 14px;
    text-align: center;
    font-size: 14px;
    letter-spacing: 2px;
    color: hsl(90 10% 60%);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .panel-tab:hover { color: hsl(90 20% 85%); }
  .panel-tab.active {
    color: hsl(90 30% 80%);
    border-bottom-color: hsl(90 30% 50%);
    background: hsl(90 8% 18%);
  }
  .panel-body {
    padding: 20px;
    overflow-y: auto;
    flex: 1;
  }
  .panel-close {
    position: absolute;
    top: 16px; right: 20px;
    width: 32px; height: 32px;
    display: grid; place-items: center;
    cursor: pointer;
    color: hsl(90 10% 60%);
    font-size: 20px;
    z-index: 5;
  }
  .panel-close:hover { color: hsl(90 20% 90%); }

  /* 存档格 */
  .save-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .save-slot {
    padding: 14px;
    background: hsl(90 7% 14%);
    border: 1px solid hsl(90 10% 22%);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    min-height: 100px;
  }
  .save-slot:hover {
    border-color: hsl(90 30% 45%);
    background: hsl(90 10% 18%);
  }
  .save-slot.empty { opacity: 0.5; }
  .save-slot .slot-num {
    font-size: 12px;
    color: hsl(90 15% 55%);
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .save-slot .slot-day {
    font-family: "Noto Serif SC", serif;
    font-size: 14px;
    color: hsl(90 20% 85%);
    margin-bottom: 4px;
  }
  .save-slot .slot-preview {
    font-size: 12px;
    color: hsl(90 10% 55%);
    line-height: 1.5;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .save-slot .slot-date {
    font-size: 11px;
    color: hsl(90 8% 45%);
    margin-top: 6px;
  }

  /* 设置项 */
  .setting-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid hsl(90 7% 20%);
  }
  .setting-row:last-child { border-bottom: none; }
  .setting-label { font-size: 14px; color: hsl(90 15% 75%); letter-spacing: 1px; }
  .setting-control {
    display: flex; gap: 8px; align-items: center;
  }
  .toggle-btn {
    width: 48px; height: 24px;
    background: hsl(90 7% 20%);
    border-radius: 12px;
    position: relative;
    cursor: pointer;
    transition: background 0.2s;
    border: 1px solid hsl(90 10% 28%);
  }
  .toggle-btn::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 18px; height: 18px;
    background: hsl(90 10% 50%);
    border-radius: 50%;
    transition: all 0.2s;
  }
  .toggle-btn.on { background: hsl(90 30% 35%); }
  .toggle-btn.on::after { left: 26px; background: hsl(90 40% 70%); }

  /* 结局回顾 */
  .ending-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .ending-card {
    padding: 16px;
    background: hsl(90 7% 14%);
    border: 1px solid hsl(90 10% 22%);
    border-radius: 4px;
    min-height: 120px;
  }
  .ending-card.locked {
    opacity: 0.4;
    filter: grayscale(1);
  }
  .ending-card.unlocked {
    border-color: hsl(25 50% 40%);
    background: linear-gradient(180deg, hsl(25 20% 16%), hsl(90 7% 14%));
  }
  .ending-title {
    font-family: "Noto Serif SC", serif;
    font-size: 16px;
    font-weight: 700;
    color: hsl(90 20% 85%);
    margin-bottom: 6px;
    letter-spacing: 2px;
  }
  .ending-card.unlocked .ending-title { color: hsl(25 60% 70%); }
  .ending-desc {
    font-size: 12px;
    color: hsl(90 10% 55%);
    line-height: 1.6;
  }
  .ending-card.locked .ending-title::before { content: '？？？'; }
  .ending-card.locked .ending-desc { content: '尚未解锁'; }

  /* ===== 结局画面 ===== */
  .ending-screen {
    position: absolute; inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #000;
    z-index: 60;
    opacity: 0;
    pointer-events: none;
    transition: opacity 2s ease;
  }
  .ending-screen.show { opacity: 1; pointer-events: auto; }
  .ending-screen .epilogue {
    max-width: 640px;
    padding: 0 32px;
    text-align: center;
    font-family: "Noto Serif SC", serif;
    font-size: 17px;
    line-height: 2.2;
    color: hsl(90 10% 85%);
    letter-spacing: 1px;
    margin-bottom: 48px;
  }
  .ending-screen .ending-title-big {
    font-family: "Noto Serif SC", serif;
    font-weight: 900;
    font-size: clamp(2rem, 6vw, 3.5rem);
    letter-spacing: 10px;
    color: hsl(0 60% 55%);
    text-shadow: 0 0 30px rgba(200,50,50,0.4);
    margin-bottom: 16px;
  }
  .ending-screen .ending-sub {
    font-size: 14px;
    letter-spacing: 4px;
    color: hsl(90 10% 55%);
    margin-bottom: 40px;
  }

  /* ===== 过渡特效 ===== */
  .fade-overlay {
    position: absolute; inset: 0;
    background: #000;
    z-index: 40;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .fade-overlay.active { opacity: 1; }

  /* ===== 雪花效果 ===== */
  .snow-canvas {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 5;
  }

  /* ===== 响应式 ===== */
  @media (max-width: 768px) {
    .dialog-box { bottom: 12px; padding: 14px 16px 18px; }
    .dialog-text { font-size: 15px; min-height: 80px; line-height: 1.8; }
    .speaker-name { font-size: 13px; padding: 3px 10px; }
    .sprite { height: 70%; max-height: 70vh; }
    .sprite.left { left: -5%; }
    .sprite.right { right: -5%; }
    .save-grid { grid-template-columns: repeat(2, 1fr); }
    .ending-grid { grid-template-columns: 1fr; }
    .stat-bar { width: 50px; }
    .chapter-label { font-size: 12px; letter-spacing: 2px; }
    .top-hud { padding: 10px 14px; }
    .choice-btn { font-size: 14px; padding: 12px 16px; }
  }

  /* 滚动条美化 */
  .panel-body::-webkit-scrollbar { width: 6px; }
  .panel-body::-webkit-scrollbar-track { background: transparent; }
  .panel-body::-webkit-scrollbar-thumb { background: hsl(90 10% 28%); border-radius: 3px; }
</style>
</head>
<body>

<div id="game">
  <!-- 背景层 -->
  <div id="bgLayer" class="bg-layer bg-kenburns"></div>

  <!-- 雪花 -->
  <canvas id="snowCanvas" class="snow-canvas"></canvas>

  <!-- 立绘层 -->
  <div id="spriteLayer" class="sprite-layer"></div>

  <!-- 顶部 HUD -->
  <div id="topHud" class="top-hud" style="display:none;">
    <div class="chapter-label">
      <span class="day" id="dayLabel">Day 1</span>
      <span id="chapterLabel">蒂米什瓦拉风波初起</span>
    </div>
    <div class="flex items-center gap-3">
      <div class="stat-bar-wrap">
        <div class="stat-item">
          <span style="color:hsl(25 60% 65%);">兵器</span>
          <div class="stat-bar"><div id="weaponBar" class="stat-bar-fill weapon" style="width:50%"></div></div>
        </div>
        <div class="stat-item">
          <span style="color:hsl(340 60% 65%);">人性</span>
          <div class="stat-bar"><div id="humanBar" class="stat-bar-fill human" style="width:50%"></div></div>
        </div>
      </div>
      <button class="menu-btn" id="menuBtn" title="菜单">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </div>

  <!-- 对话框 -->
  <div id="dialogBox" class="dialog-box" style="display:none;">
    <div id="speakerName" class="speaker-name narr">旁白</div>
    <div class="dialog-text"><span id="dialogText"></span><span class="cursor" id="textCursor"></span></div>
    <div id="clickIndicator" class="click-indicator" style="display:none;"></div>
  </div>

  <!-- 选项 -->
  <div id="choicesBox" class="choices-box" style="display:none;"></div>

  <!-- 淡入淡出遮罩 -->
  <div id="fadeOverlay" class="fade-overlay"></div>

  <!-- 标题界面 -->
  <div id="titleScreen" class="title-screen">

  day3: [
    { type:'setBg', bg:'bucharestSquare' },
    { type:'narr', text:'接下来的两天，局势以惊人的速度恶化。\n\n骚乱像野火一样蔓延到了全国。\n从蒂米什瓦拉到克鲁日，从雅西到布加勒斯特……\n\n到处都是人群，到处都是口号，到处都是……\n对自由的渴望。' },
    { type:'dialog', speaker:'tanke', name:'檀可露斯', text:'通讯中断。\n指令反复矛盾。\n上一小时说"坚决镇压"，下一小时说"保持克制"。\n指挥系统……已经混乱了。' },

    { type:'dialog', speaker:'mihai', name:'米哈伊', text:'嗯？' },
    { type:'dialog', speaker:'tanke', name:'檀可露斯', text:'外面……有人在靠近。\n一个人。\n受伤了。' },
    { type:'narr', text:'米哈伊凑到观察镜前。\n\n他看到一个年轻的女孩，穿着学生制服，腿上流着血，一瘸一拐地向坦克的方向走来。\n\n她的身后，远处有军警的脚步声在逼近。' },
    { type:'dialog', speaker:'mihai', name:'米哈伊', text:'是个学生……\n她受伤了。' },

    { type:'setBg', bg:'tankNight' },

  day5: [
    { type:'setBg', bg:'bucharestSquare' },

// ---------- 游戏状态 ----------
const game = {
  currentNode: 'start',
  currentIndex: 0,
  weapon: 50, // 兵器度
  human: 50,  // 人性度
  flags: {},
  day: 1,
  chapterTitle: '',
  isTyping: false,
  typeTimer: null,
  fullText: '',
  displayedText: '',
  autoPlay: false,
  autoTimer: null,
  skipMode: false,
  textSpeed: 'normal', // slow / normal / fast
  autoSpeed: 3.0,
  snowEnabled: true,
  currentBg: '',
  sprites: {}, // {char: {pos, show}}
  route: '', // order / neutral / rebel
};

// ---------- DOM 引用 ----------
const $ = id => document.getElementById(id);
const titleScreen = $('titleScreen');
const bgLayer = $('bgLayer');
const spriteLayer = $('spriteLayer');
const dialogBox = $('dialogBox');
const speakerName = $('speakerName');
const dialogText = $('dialogText');
const textCursor = $('textCursor');
const clickIndicator = $('clickIndicator');
const choicesBox = $('choicesBox');
const topHud = $('topHud');
const dayLabel = $('dayLabel');
const chapterLabel = $('chapterLabel');
const weaponBar = $('weaponBar');
const humanBar = $('humanBar');
const fadeOverlay = $('fadeOverlay');
const systemPanel = $('systemPanel');
const endingScreen = $('endingScreen');
const endingTitleBig = $('endingTitleBig');
const endingSub = $('endingSub');
const endingEpilogue = $('endingEpilogue');

// ---------- 工具函数 ----------
function getSpeed() {
  switch(game.textSpeed) {
    case 'slow': return 60;
    case 'fast': return 15;
    default: return 35;
  }
}

function updateStats() {
  weaponBar.style.width = game.weapon + '%';
  humanBar.style.width = game.human + '%';
}

function adjustStats(weaponDelta = 0, humanDelta = 0) {
  game.weapon = Math.max(0, Math.min(100, game.weapon + weaponDelta));
  game.human = Math.max(0, Math.min(100, game.human + humanDelta));
  // 此消彼长：如果只变一个，另一个反向微调
  if (weaponDelta !== 0 && humanDelta === 0) {
    game.human = Math.max(0, Math.min(100, game.human - weaponDelta * 0.5));
  }
  if (humanDelta !== 0 && weaponDelta === 0) {
    game.weapon = Math.max(0, Math.min(100, game.weapon - humanDelta * 0.5));
  }
  updateStats();
}

function setFlag(name, value = true) {
  game.flags[name] = value;
  if (name === 'route_order') game.route = 'order';
  if (name === 'route_neutral') game.route = 'neutral';
  if (name === 'route_rebel') game.route = 'rebel';
}

// ---------- 场景切换 ----------
function changeBg(bgKey) {
  if (game.currentBg === bgKey) return;
  game.currentBg = bgKey;
  bgLayer.style.opacity = '0';
  setTimeout(() => {
    bgLayer.style.backgroundImage = `url("${BG[bgKey]}")`;
    bgLayer.style.opacity = '1';
  }, 600);
}

function setSprite(char, pos = 'center', show = true) {
  // 清除所有立绘
  if (show) {
    spriteLayer.innerHTML = '';
    const img = document.createElement('img');
    img.src = SPRITE[char];
    img.className = `sprite ${pos}`;
    img.alt = char;
    spriteLayer.appendChild(img);
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        img.classList.add('show');
      });
    });
  } else {
    spriteLayer.innerHTML = '';
  }
  game.sprites = show ? { [char]: { pos, show } } : {};
}

// ---------- 打字机效果 ----------
function typeText(text) {
  game.isTyping = true;
  game.fullText = text;
  game.displayedText = '';
  dialogText.textContent = '';
  clickIndicator.style.display = 'none';
  clearInterval(game.typeTimer);

  const lines = text.split('\n');
  let lineIdx = 0, charIdx = 0;

  game.typeTimer = setInterval(() => {
    if (lineIdx >= lines.length) {
      finishTyping();
      return;
    }
    const line = lines[lineIdx];
    if (charIdx < line.length) {
      game.displayedText += line[charIdx];
      dialogText.textContent = game.displayedText;
      charIdx++;
    } else {
      game.displayedText += '\n';
      dialogText.textContent = game.displayedText;
      lineIdx++;
      charIdx = 0;
    }
  }, getSpeed());
}

function finishTyping() {
  clearInterval(game.typeTimer);
  game.isTyping = false;
  game.displayedText = game.fullText;
  dialogText.textContent = game.fullText;
  clickIndicator.style.display = 'block';

  if (game.autoPlay) {
    clearTimeout(game.autoTimer);
    game.autoTimer = setTimeout(() => {
      nextLine();
    }, game.autoSpeed * 1000);
  }
}

function skipTyping() {
  if (game.isTyping) {
    finishTyping();
  }
}

// ---------- 剧情推进 ----------
function getCurrentLine() {
  const node = SCRIPT[game.currentNode];
  if (!node || game.currentIndex >= node.length) return null;
  return node[game.currentIndex];
}

function processLine(line) {
  switch(line.type) {
    case 'setBg':
      changeBg(line.bg);
      advance();
      break;

    case 'setSprite':
      setSprite(line.char, line.pos, line.show);
      advance();
      break;

    case 'narr':
      if (line.bg) changeBg(line.bg);
      showDialog('narr', '旁白', line.text);
      break;

    case 'dialog':
      if (line.bg) changeBg(line.bg);
      showDialog(line.speaker, line.name, line.text);
      break;

    case 'dayTitle':
      showDayTitle(line.day, line.title);
      break;

    case 'choice':
      showChoices(line.options);
      break;

    case 'jump':
      game.currentNode = line.target;
      game.currentIndex = 0;
      processLine(getCurrentLine());
      break;

    case 'ending':
      showEnding(line.id);
      break;

    default:
      advance();
  }
}

function showDialog(speaker, name, text) {
  speakerName.textContent = name;
  speakerName.className = 'speaker-name ' + speaker;
  typeText(text);
}

function showDayTitle(day, title) {
  game.chapterTitle = title;
  const dayNum = parseInt(day.match(/\d+/)[0]);
  game.day = dayNum;
  dayLabel.textContent = `Day ${dayNum}`;
  chapterLabel.textContent = title;

  // 显示章节过场
  const overlay = document.createElement('div');
  overlay.style.cssText = `
    position:absolute; inset:0;
    background: rgba(0,0,0,0.85);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    z-index: 35;
    transition: opacity 1.2s ease;
    font-family: "Noto Serif SC", serif;
  `;
  overlay.innerHTML = `
    <div style="font-size:clamp(1.5rem,4vw,2.5rem); letter-spacing:8px; color:hsl(25 60% 65%); margin-bottom:16px; animation: titleFade 1.2s ease-out;">${day}</div>
    <div style="font-size:clamp(1.2rem,3vw,1.8rem); letter-spacing:6px; color:hsl(90 10% 85%); animation: titleFade 1.2s ease-out 0.3s both;">${title}</div>
  `;
  document.getElementById('game').appendChild(overlay);

  setTimeout(() => {
    overlay.style.opacity = '0';
    setTimeout(() => {
      overlay.remove();
      advance();
    }, 1200);
  }, 2500);
}

function showChoices(options) {
  clickIndicator.style.display = 'none';
  choicesBox.innerHTML = '';

  // 过滤条件选项
  const availableOptions = options.filter(opt => {
    if (!opt.condition) return true;
    switch(opt.condition) {
      case 'weapon_high': return game.weapon >= 65;
      case 'human_mid':   return game.human >= 40;
      case 'human_high':  return game.human >= 80;
      case 'human_midhigh': return game.human >= 60 && game.human < 80;
      default: return true;
    }
  });

  // 如果只有一个选项满足条件但还有其他选项，调整显示
  const displayOptions = availableOptions.length > 0 ? availableOptions : options.slice(0, 1);

  displayOptions.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = opt.text;
    btn.addEventListener('click', () => {
      if (opt.weapon) adjustStats(opt.weapon, 0);
      if (opt.human) adjustStats(0, opt.human);
      if (opt.flag) setFlag(opt.flag);
      choicesBox.style.display = 'none';
      game.currentNode = opt.next;
      game.currentIndex = 0;
      processLine(getCurrentLine());
    });
    choicesBox.appendChild(btn);
  });

  choicesBox.style.display = 'flex';
}

function showEnding(id) {
  const ending = ENDINGS[id];
  if (!ending) return;

  // 保存结局解锁
  saveEndingUnlock(id);

  dialogBox.style.display = 'none';
  topHud.style.display = 'none';
  spriteLayer.innerHTML = '';

  endingTitleBig.textContent = ending.title;
  endingSub.textContent = ending.sub;
  endingEpilogue.textContent = ending.epilogue;
  endingEpilogue.style.whiteSpace = 'pre-line';

  endingScreen.classList.add('show');
}

function advance() {
  game.currentIndex++;
  const line = getCurrentLine();
  if (line) {
    processLine(line);
  } else {
    // 节点结束，理论上应该有 jump 或 ending
    console.warn('Node ended without jump/ending:', game.currentNode);
  }
}

function nextLine() {
  if (game.isTyping) {
    if (game.skipMode) {
      finishTyping();
    } else {
      finishTyping();
    }
    return;
  }

  const line = getCurrentLine();
  if (!line) return;

  if (line.type === 'choice') return; // 选项不自动跳过
  if (line.type === 'ending') return;

  advance();
}

// ---------- 开始游戏 ----------
function startGame(fromSave = null) {
  if (fromSave) {
    Object.assign(game, fromSave);
  } else {
    game.currentNode = 'start';
    game.currentIndex = 0;
    game.weapon = 50;
    game.human = 50;
    game.flags = {};
    game.day = 1;
    game.route = '';
  }

  // 重置 UI
  titleScreen.style.opacity = '0';
  titleScreen.style.pointerEvents = 'none';
  setTimeout(() => { titleScreen.style.display = 'none'; }, 1000);

  endingScreen.classList.remove('show');
  dialogBox.style.display = 'block';
  topHud.style.display = 'flex';
  updateStats();
  dayLabel.textContent = `Day ${game.day}`;
  chapterLabel.textContent = game.chapterTitle || '';

  // 开始剧情
  processLine(getCurrentLine());
}

// ---------- 存档系统 ----------
const SAVE_KEY = 'tieyuhongxue_saves';
const ENDING_KEY = 'tieyuhongxue_endings';
const QUICKSAVE_KEY = 'tieyuhongxue_quicksave';

function getSaves() {
  try {
    return JSON.parse(localStorage.getItem(SAVE_KEY)) || {};
  } catch { return {}; }
}

function saveToSlot(slot) {
  const saves = getSaves();
  const saveData = {
    currentNode: game.currentNode,
    currentIndex: game.currentIndex,
    weapon: game.weapon,
    human: game.human,
    flags: {...game.flags},
    day: game.day,
    chapterTitle: game.chapterTitle,
    route: game.route,
    currentBg: game.currentBg,
    preview: game.fullText ? game.fullText.substring(0, 50) : '',
    date: new Date().toLocaleString('zh-CN'),
  };
  saves[slot] = saveData;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(saves));
  } catch(e) { console.warn('Save failed', e); }
  renderSaveGrid();
  renderLoadGrid();
}

function loadFromSlot(slot) {
  const saves = getSaves();
  const save = saves[slot];
  if (!save) return false;
  startGame(save);
  // 重新设置背景
  if (save.currentBg) {
    bgLayer.style.backgroundImage = `url("${BG[save.currentBg]}")`;
  }
  closeSystemPanel();
  return true;
}

function quickSave() {
  try {
    localStorage.setItem(QUICKSAVE_KEY, JSON.stringify({
      currentNode: game.currentNode,
      currentIndex: game.currentIndex,
      weapon: game.weapon,
      human: game.human,
      flags: {...game.flags},
      day: game.day,
      chapterTitle: game.chapterTitle,
      route: game.route,
      currentBg: game.currentBg,
    }));
  } catch(e) {}
}

function quickLoad() {
  try {
    const data = JSON.parse(localStorage.getItem(QUICKSAVE_KEY));
    if (data) {
      startGame(data);
      if (data.currentBg) {
        bgLayer.style.backgroundImage = `url("${BG[data.currentBg]}")`;
      }
      return true;
    }
  } catch(e) {}
  return false;
}

function hasQuickSave() {
  try {
    return !!localStorage.getItem(QUICKSAVE_KEY);
  } catch { return false; }
}

// 结局解锁
function getUnlockedEndings() {
  try {
    return JSON.parse(localStorage.getItem(ENDING_KEY)) || {};
  } catch { return {}; }
}

function saveEndingUnlock(id) {
  const endings = getUnlockedEndings();
  endings[id] = true;
  try {
    localStorage.setItem(ENDING_KEY, JSON.stringify(endings));
  } catch(e) {}
}

// ---------- UI 渲染 ----------
function renderSaveGrid() {
  const grid = $('saveGrid');
  const saves = getSaves();
  grid.innerHTML = '';
  for (let i = 1; i <= 6; i++) {
    const slot = document.createElement('div');
    slot.className = 'save-slot' + (saves[i] ? '' : ' empty');
    if (saves[i]) {
      slot.innerHTML = `
        <div class="slot-num">存档 ${i}</div>
        <div class="slot-day">Day ${saves[i].day} · ${saves[i].chapterTitle || ''}</div>
        <div class="slot-preview">${saves[i].preview || ''}</div>
        <div class="slot-date">${saves[i].date || ''}</div>
      `;
      slot.addEventListener('click', () => {
        if (confirm(`确定要覆盖存档 ${i} 吗？`)) {
          saveToSlot(i);
          alert('保存成功！');
        }
      });
    } else {
      slot.innerHTML = `
        <div class="slot-num">存档 ${i}</div>
        <div class="slot-day">空存档</div>
        <div class="slot-preview">点击保存</div>
      `;
      slot.addEventListener('click', () => {
        saveToSlot(i);
        alert('保存成功！');
      });
    }
    grid.appendChild(slot);
  }
}

function renderLoadGrid() {
  const grid = $('loadGrid');
  const saves = getSaves();
  grid.innerHTML = '';
  for (let i = 1; i <= 6; i++) {
    const slot = document.createElement('div');
    slot.className = 'save-slot' + (saves[i] ? '' : ' empty');
    if (saves[i]) {
      slot.innerHTML = `
        <div class="slot-num">存档 ${i}</div>
        <div class="slot-day">Day ${saves[i].day} · ${saves[i].chapterTitle || ''}</div>
        <div class="slot-preview">${saves[i].preview || ''}</div>
        <div class="slot-date">${saves[i].date || ''}</div>
      `;
      slot.addEventListener('click', () => {
        loadFromSlot(i);
      });
    } else {
      slot.innerHTML = `
        <div class="slot-num">存档 ${i}</div>
        <div class="slot-day">空存档</div>
        <div class="slot-preview">暂无数据</div>
      `;
    }
    grid.appendChild(slot);
  }
}

function renderEndingGrid() {
  const grid = $('endingGrid');
  const unlocked = getUnlockedEndings();
  grid.innerHTML = '';
  Object.entries(ENDINGS).forEach(([id, ending]) => {
    const card = document.createElement('div');
    const isUnlocked = !!unlocked[id];
    card.className = 'ending-card ' + (isUnlocked ? 'unlocked' : 'locked');
    if (isUnlocked) {
      card.innerHTML = `
        <div class="ending-title">${ending.title}</div>
        <div class="ending-desc">${ending.sub}<br><br>${ending.epilogue.substring(0, 60)}……</div>
      `;
    } else {
      card.innerHTML = `
        <div class="ending-title"></div>
        <div class="ending-desc">尚未解锁<br>完成对应路线以解锁此结局</div>
      `;
    }
    grid.appendChild(card);
  });
}

// ---------- 系统面板 ----------
function openSystemPanel(tab = 'save') {
  systemPanel.classList.add('show');
  switchTab(tab);
}

function closeSystemPanel() {
  systemPanel.classList.remove('show');
}

function switchTab(tab) {
  document.querySelectorAll('.panel-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  document.querySelectorAll('.tab-content').forEach(c => {
    c.style.display = 'none';
  });
  const target = $('tab-' + tab);
  if (target) target.style.display = 'block';

  if (tab === 'save') renderSaveGrid();
  if (tab === 'load') renderLoadGrid();
  if (tab === 'endings') renderEndingGrid();
}

// ---------- 雪花效果 ----------
const snowCanvas = $('snowCanvas');
const snowCtx = snowCanvas.getContext('2d');
let snowParticles = [];
let snowAnimId = null;

function initSnow() {
  snowCanvas.width = window.innerWidth;
  snowCanvas.height = window.innerHeight;
  snowParticles = [];
  const count = Math.floor((snowCanvas.width * snowCanvas.height) / 12000);
  for (let i = 0; i < count; i++) {
    snowParticles.push({
      x: Math.random() * snowCanvas.width,
      y: Math.random() * snowCanvas.height,
      r: Math.random() * 2 + 0.5,
      speed: Math.random() * 0.8 + 0.3,
      drift: Math.random() * 0.4 - 0.2,
      opacity: Math.random() * 0.5 + 0.3,
    });
  }
}

function animateSnow() {
  if (!game.snowEnabled) return;
  snowCtx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);
  snowParticles.forEach(p => {
    snowCtx.beginPath();
    snowCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    snowCtx.fillStyle = `rgba(220, 220, 220, ${p.opacity})`;
    snowCtx.fill();
    p.y += p.speed;
    p.x += p.drift;
    if (p.y > snowCanvas.height) {
      p.y = -5;
      p.x = Math.random() * snowCanvas.width;
    }
    if (p.x > snowCanvas.width) p.x = 0;
    if (p.x < 0) p.x = snowCanvas.width;
  });
  snowAnimId = requestAnimationFrame(animateSnow);
}

function stopSnow() {
  if (snowAnimId) cancelAnimationFrame(snowAnimId);
  snowCtx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);
}

window.addEventListener('resize', () => {
  initSnow();
});

// ---------- 事件绑定 ----------
// 点击对话框推进
dialogBox.addEventListener('click', () => {
  if (choicesBox.style.display !== 'none') return;
  if (game.autoPlay) {
    clearTimeout(game.autoTimer);
    game.autoPlay = false;
  }
  nextLine();
});

// 空格/回车推进
document.addEventListener('keydown', (e) => {
  if (titleScreen.style.display !== 'none') return;
  if (systemPanel.classList.contains('show')) return;
  if (endingScreen.classList.contains('show')) return;

  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    if (choicesBox.style.display !== 'none') return;
    nextLine();
  }
  if (e.code === 'KeyS') {
    quickSave();
    showToast('已快速存档');
  }
  if (e.code === 'KeyL') {
    if (quickLoad()) {
      showToast('已快速读档');
    }
  }
  if (e.code === 'KeyA') {
    game.autoPlay = !game.autoPlay;
    showToast(game.autoPlay ? '自动播放 开' : '自动播放 关');
    if (game.autoPlay && !game.isTyping) {
      clearTimeout(game.autoTimer);
      game.autoTimer = setTimeout(() => nextLine(), game.autoSpeed * 1000);
    }
  }
  if (e.code === 'Escape') {
    if (systemPanel.classList.contains('show')) {
      closeSystemPanel();
    } else {
      openSystemPanel('save');
    }
  }
});

// Toast
function showToast(msg) {
  const toast = document.createElement('div');
  toast.textContent = msg;
  toast.style.cssText = `
    position: fixed;
    top: 60px; left: 50%;
    transform: translateX(-50%);
    padding: 8px 20px;
    background: rgba(20,24,18,0.9);
    border: 1px solid hsl(90 15% 30%);
    border-radius: 4px;
    color: hsl(90 20% 85%);
    font-size: 13px;
    letter-spacing: 1px;
    z-index: 200;
    animation: toastFade 2s ease forwards;
  `;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2000);
}

    $('continueBtn').addEventListener('click', (e) => {
      e.stopImmediatePropagation();
    }, true);
  }

  // 初始背景
  bgLayer.style.backgroundImage = `url("${BG.tankInterior}")`;
});
