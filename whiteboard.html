<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>持久实时涂鸦白板</title>
  <style>
    * {margin:0;padding:0;box-sizing:border-box}
    body {background:#eee; overflow:hidden}
    #controls {padding:8px; background:#fff; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
    canvas {
      display:block;
      background:white;
      cursor:crosshair;
      touch-action: none; /* 关键：禁止手机拖动页面 */
    }
  </style>
</head>
<body>
<div id="controls">
  <input type="color" id="color" value="#000000">
  <input type="range" id="lineWidth" min="1" max="30" value="3">
  <span id="widthText">3</span>
  <button id="clearBtn">清空白板</button>
</div>
<canvas id="canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ========== 在这里替换你的 Supabase 信息 ==========
const SUPABASE_URL = "https://jskammvczvlyypikeaiw.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_rAfWptptOQo46j4cmCq7Hw_RXm6nANl";
const ROOM_ID           = "room001";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const colorInput = document.getElementById("color");
const widthInput = document.getElementById("lineWidth");
const widthText = document.getElementById("widthText");
const clearBtn = document.getElementById("clearBtn");

let isDrawing = false;
let currentPoints = [];

// 获取画布相对坐标（鼠标/触摸通用）
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  if(e.touches){
    // 触摸事件
    return {
      x: e.touches[0].clientX - rect.left,
      y: e.touches[0].clientY - rect.top
    }
  }else{
    // 鼠标事件
    return {x:e.offsetX, y:e.offsetY}
  }
}

// 画布自适应窗口
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight - 50;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

widthInput.oninput = ()=> widthText.innerText = widthInput.value;

// 绘制一条笔迹
function drawStroke(points, color, line_width) {
  if(points.length < 2) return;
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = line_width;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.moveTo(points[0].x, points[0].y);
  for(let i=1; i<points.length; i++){
    ctx.lineTo(points[i].x, points[i].y);
  }
  ctx.stroke();
}

// 1. 页面加载：读取数据库所有历史笔迹，全部画出来
async function loadHistoryDrawings(){
  const {data, error} = await supabase
    .from('drawings')
    .select('*')
    .eq('room', ROOM_ID)
    .order('created_at', {asc:true})
  if(error) console.error("加载历史失败", error);
  else {
    data.forEach(item => {
      drawStroke(item.points, item.color, item.line_width)
    })
  }
}

// 2. 订阅实时更新：新增线条 + 删除（清空）
function subscribeRealtime(){
  supabase
    .channel(`drawing:${ROOM_ID}`)
    .on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'drawings',
      filter: `room=eq.${ROOM_ID}`
    }, (payload)=>{
      const newStroke = payload.new;
      drawStroke(newStroke.points, newStroke.color, newStroke.line_width)
    })
    .on('postgres_changes', {
      event: 'DELETE',
      schema: 'public',
      table: 'drawings',
      filter: `room=eq.${ROOM_ID}`
    }, ()=>{
      ctx.clearRect(0,0,canvas.width, canvas.height);
    })
    .subscribe()
}

// ======== 鼠标事件（电脑） ========
canvas.onmousedown = (e)=>{
  isDrawing = true;
  const pos = getPos(e);
  currentPoints = [{x:pos.x, y:pos.y}]
}
canvas.onmousemove = (e)=>{
  if(!isDrawing) return;
  const pos = getPos(e);
  currentPoints.push({x:pos.x, y:pos.y})
  drawStroke([currentPoints[currentPoints.length-2], currentPoints[currentPoints.length-1]], colorInput.value, widthInput.value)
}
canvas.onmouseup = async ()=>{
  if(!isDrawing) return;
  isDrawing = false;
  if(currentPoints.length <2) return;
  await supabase.from('drawings').insert({
    room: ROOM_ID,
    points: currentPoints,
    color: colorInput.value,
    line_width: Number(widthInput.value)
  })
}
canvas.onmouseleave = canvas.onmouseup;

// ======== 触摸事件（手机）【新增】 ========
canvas.ontouchstart = (e)=>{
  e.preventDefault();
  isDrawing = true;
  const pos = getPos(e);
  currentPoints = [{x:pos.x, y:pos.y}]
}
canvas.ontouchmove = (e)=>{
  e.preventDefault();
  if(!isDrawing) return;
  const pos = getPos(e);
  currentPoints.push({x:pos.x, y:pos.y})
  drawStroke([currentPoints[currentPoints.length-2], currentPoints[currentPoints.length-1]], colorInput.value, widthInput.value)
}
canvas.ontouchend = async (e)=>{
  e.preventDefault();
  if(!isDrawing) return;
  isDrawing = false;
  if(currentPoints.length <2) return;
  await supabase.from('drawings').insert({
    room: ROOM_ID,
    points: currentPoints,
    color: colorInput.value,
    line_width: Number(widthInput.value)
  })
}
canvas.ontouchcancel = canvas.ontouchend;

// 清空白板
clearBtn.onclick = async ()=>{
  await supabase.from('drawings').delete().eq('room', ROOM_ID);
  ctx.clearRect(0,0,canvas.width, canvas.height);
}

// 初始化
loadHistoryDrawings();
subscribeRealtime();
</script>
</body>
</html>
